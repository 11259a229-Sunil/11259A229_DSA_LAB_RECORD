
name: Build C Programs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C Programs
        shell: msys2 {0}
        run: |
          mkdir -p exe

          gcc 11259A229_exp1.c -o exe/array.exe
          gcc 11259A229_exp10.c -o exe/graph.exe
          gcc 11259A229_exp11.c -o exe/sorting.exe
          gcc 11259A229_exp12.c -o exe/hashing.exe
          gcc 11259A229_exp2.c -o exe/employee.exe
          gcc 11259A229_exp3.c -o exe/infix.exe
          gcc 11259A229_exp4.c -o exe/postfix.exe -lm
          gcc 11259A229_exp5.c -o exe/queue.exe
          gcc 11259A229_exp6.c -o exe/priority.exe
          gcc 11259A229_exp7.c -o exe/linkedlist.exe
          gcc 11259A229_exp8.c -o exe/circularqueue.exe
          gcc 11259A229_exp9.c -o exe/bst.exe

      - name: Upload EXE Files
        uses: actions/upload-artifact@v4
        with:
          name: C-Programs-EXE
          path: exe/*.exe
          if-no-files-found: error
