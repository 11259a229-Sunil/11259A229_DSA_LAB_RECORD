
name: Build C Programs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C Programs
        shell: msys2 {0}
        run: |
          mkdir -p exe

          for file in *.c; do
            if [ ! -f "$file" ]; then
              echo "No C files found!"
              exit 1
            fi

            output="exe/${file%.c}.exe"

            echo "Compiling $file..."

            gcc "$file" -o "$output" -lm || exit 1
          done

          echo "All C programs compiled successfully!"

      - name: Upload EXE Files
        uses: actions/upload-artifact@v4
        with:
          name: C-Programs-EXE
          path: exe/*.exe
          if-no-files-found: error

